name: Release desktop build

# Tag a version (git tag v1.2.0 && git push origin v1.2.0) and this builds
# the single-exe Windows desktop app and attaches it to a GitHub Release —
# the download URL for the landing page / README badge.
#
#   https://github.com/yfxiao123/citens/releases/latest/download/CiteLens.exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,packaging,dev]"
      - name: Test (the exe ships this code)
        run: pytest tests/ -q
        env:
          LLM_API_KEY: test-key
      - name: Build
        run: pyinstaller citens.spec --noconfirm
      - name: Smoke test the exe
        shell: cmd
        run: dist\CiteLens.exe --import-check
      # versioned copy: the exe self-reports via the frozen fallback in
      # citens/__init__.py, but a version in the FILENAME is what users
      # actually see in their downloads folder (the v1.4.0 exe shipped
      # reporting 1.3.3 — indistinguishable on disk)
      - name: Add versioned copy
        shell: pwsh
        run: |
          $v = python -c "from citens import __version__; print(__version__)"
          Copy-Item dist/CiteLens.exe "dist/CiteLens-$v.exe"
          "EXE_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CiteLens-windows
          path: dist/CiteLens*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CiteLens*.exe

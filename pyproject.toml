[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citens"
version = "1.2.0"
description = "An open-source literature-review agent that writes critical, citation-grounded surveys — every claim verifiable against its source."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CiteLens Contributors" }]
keywords = [
    "literature-review",
    "academic-research",
    "agent",
    "citation",
    "survey-generation",
    "rag",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "httpx>=0.27",
    "anyio>=4",
    "openai>=1.12",
    "typer>=0.12",
    "rich>=13",
    "arxiv>=2.0",
    # Full-text citation grounding: PDF -> MarkItDown -> chunks. Core since
    # 1.1.0 — without it every PDF fetch silently degrades to abstract-only
    # grounding and the numbers/effects chain never fires.
    "markitdown[pdf]>=0.0.1",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "sse-starlette>=2.0"]
# Native multi-provider routing (Anthropic/Gemini/Bedrock/Cohere) via LiteLLM.
# The default OpenAI-compatible backend already covers OpenAI/DeepSeek/Ollama/
# OpenRouter/vLLM/Groq without this extra.
multi = ["litellm>=1.40"]
# Building the single-exe desktop app (pyinstaller citens.spec --noconfirm).
packaging = ["pyinstaller>=6.6"]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
citens = "citens.cli:app"
citens-desktop = "citens.desktop:main"

[project.urls]
Homepage = "https://github.com/yfxiao123/citens"
Repository = "https://github.com/yfxiao123/citens"
Issues = "https://github.com/yfxiao123/citens/issues"

[tool.setuptools.package-data]
citens = ["profiles/*.json"]

[tool.setuptools.packages.find]
include = ["citens*"]
exclude = ["tests*", "resource*", "examples*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"citens/cli.py" = ["B008"]  # Typer idiom: Argument/Option as parameter defaults
"citens/api/app.py" = ["B008"]  # FastAPI idiom: Security() in parameter defaults

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
# Type-check against 3.12: numpy 2.x ships py.typed stubs using 3.12-only
# syntax, and under an older target mypy aborts on THEIR file before ever
# checking ours (there is no way to skip parsing a followed stub). Runtime
# 3.10/3.11 compatibility is enforced by the CI pytest matrix instead.
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

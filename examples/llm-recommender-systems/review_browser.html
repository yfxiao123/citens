const DATA = {"topic": "基于大语言模型的推荐系统", "precision": 1.0, "pre": 0.865, "post": 1.0, "counts": {"supported": 52, "partial": 52, "background": 0, "contradictory": 0, "unsupported": 0, "unverifiable": 3}, "claims": [{"i": 0, "text": "[0]与[1]两篇综述、[5]的立场文章共同构成了这一交叉方向的基础入口：前者分别从适配方式与任务场景两个维度梳理已有研究，后者从个性化目标的角度提出尚未解决的问题。", "verdict": "supported", "note": "[0] systematizes LLM4Rec by modeling/adaptation dimensions, [1] surveys task scenarios, and [5] discusses personalization challenges and open problems; the characterization is consistent with the ground texts.", "cites": [0, 1, 5], "evidence": [{"index": 0, "chunk_id": "d65ecdb55cb4-ft-10", "kind": "fulltext", "excerpt": "|     | LLM |     | A n s w e r |                                                                                  |     |     |     |     |\n| --- | --- | --- | ----------- | -------------------------"}, {"index": 1, "chunk_id": "83231ee9764f-ft-38", "kind": "fulltext", "excerpt": "IEEETRANSACTIONSONKNOWLEDGEANDDATAENGINEERING,SUBMISSION2023 7\nRecommendation Datasets\n|     | user_id: 1024                    |     |     |     |     | Pre-training LLMs for Recommender Systems |   "}, {"index": 5, "chunk_id": "7d1b12841f04-ft-29", "kind": "fulltext", "excerpt": "thetailentity.TagReal[55]generateshigh-qualityprompts This issue can emerge as the introduction of extraneous\nfromtheexternaltextcorpora.AutoKG[48]directlyadopts information or even noise into the rec"}], "leni": false}, {"i": 1, "text": "领域内新出现的生成式推荐综述[28]、提示驱动的新闻推荐[29]与弱模态增强的多模态推荐[30]等子方向，也将在相应语境中被引用。", "verdict": "unverifiable", "note": "cited source(s) have no abstract available", "cites": [28, 29, 30], "evidence": [], "leni": false}, {"i": 2, "text": "[0]以建模范式为第一级分类，将LLM推荐方法区分为判别式（discriminative）与生成式（generative）两大类，并汇总了五种训练/域适配方式，包括微调（fine-tuning）、提示/上下文学习（prompting/in-context learning）、提示调优（prompt tuning）与指令调优（instruction tuning）等。", "verdict": "supported", "note": "[0] explicitly taxonomizes discriminative vs generative LLM4Rec and describes fine-tuning, prompting/in-context learning, prompt tuning, and instruction tuning as adaptation manners.", "cites": [0], "evidence": [{"index": 0, "chunk_id": "d65ecdb55cb4-ft-12", "kind": "fulltext", "excerpt": "We identify key challenges faced by LLM-based recommenda-\ntion systems and propose valuable findings that can inspire further research in this\n|     | potential | field. |           |     |           "}], "leni": false}, {"i": 3, "text": "与之相对，[1]从应用场景切入，展示ChatGPT、LLaMA、T5等模型如何被用于top-K推荐、评分预测、会话式推荐与解释生成等任务；其引用的一个代表性方案是采用T5作为推荐系统骨干，允许用户以自然语言表达显式偏好和意图，最终获得优于仅依赖用户—物品交互输入的推荐效果。", "verdict": "partial", "note": "[1] supports the task-scenario part (top-K, rating, conversational, explanation with ChatGPT/LLaMA/T5), but the specific T5-backbone scheme with explicit user preferences and superiority over interaction-only input is not present in [1]'s ground text.", "cites": [1], "evidence": [{"index": 1, "chunk_id": "83231ee9764f-ft-66", "kind": "fulltext", "excerpt": "|     | Paradigms |     |     | Methods |     |     | LLMTasks          |     |     | LLMBackbones |     | References |     |\n| --- | --------- | --- | --- | ------- | --- | --- | ----------------- | "}], "leni": false}, {"i": 4, "text": "[0]所区分的两种建模范式恰好对应两种推荐理念：判别式路线将LLM用作特征编码器，保留评分或点击预测的目标函数，文本信息只是增强用户与物品表征的附加信号；生成式路线则把推荐重建为“给定用户上下文生成物品或解释”的文本生成问题。", "verdict": "supported", "note": "[0] describes discriminative LLMs as embedding backbones for downstream recommendation tasks (preserving task-specific objectives) and generative LLMs for text/token generation; the claim's two-route characterization is grounded.", "cites": [0], "evidence": [{"index": 0, "chunk_id": "d65ecdb55cb4-ft-15", "kind": "fulltext", "excerpt": "5\n\nSpecific Loss of Task A\n(1) Fine-tuning\nFine-tune the parameters of\nLLM Inference on task A\nLLM on task A\n(2) Prompting / In Context Learning\nPrompt engineering or few-\nLLM Inference on task A\nshot"}], "leni": false}, {"i": 5, "text": "两条路线在[1]所描绘的任务图景中共存，但彼此的前提存在张力：判别式路线 -- | --- | --- | ----------- | -------------------------"}, {"index": 1, "chunk_id": "83231ee9764f-ft-38", "kind": "fulltext", "excerpt": "IEEETRANSACTIONSONKNOWLEDGEANDDATAENGINEERING,SUBMISSION2023 7\nRecommendation Datasets\n|     | user_id: 1024                    |     |     |     |     | Pre-training LLMs for Recommender Systems |   "}, {"index": 5, "chunk_id": "7d1b12841f04-ft-29", "kind": "fulltext", "excerpt": "thetailentity.TagReal[55]generateshigh-qualityprompts This issue can emerge as the introduction of extraneous\nfromtheexternaltextcorpora.AutoKG[48]directlyadopts information or even noise into the rec"}], "leni": false}, {"i": 8, "text": "同时，[5]的分析也隐含一种风险：若推荐系统以语言模型对世界的先验理解为主要依据，可能弱化传统协同过滤所捕捉的行为相似性，而后者恰恰是商业推荐系统实现个性化的支柱。", "verdict": "partial", "note": "[5] does support the risk that LLMs lack visibility into platform/behavior data and that omitting such information harms accuracy, but the specific claim that reliance on LLM priors weakens collaborative-filtering behavioral similarity, and that CF is the pillar of commercial personalization, is not explicitly grounded.", "cites": [5], "evidence": [{"index": 5, "chunk_id": "7d1b12841f04-ft-57", "kind": "fulltext", "excerpt": "This mendersystemscanbecategorizedin(1)Embeddingsize\n\n10\nTABLE2\nZero/few-shotlearnersofLLMsforRS\n| Approach | LLMbackbone |     | Task                     |     | Metric   | Datasets | ICL COT |\n| ---"}], "leni": false}, {"i": 9, "text": "围绕生成式推荐[28]、提示驱动新闻推荐[29]与多模态增强推荐[30]的探索，正是这一未完成议程在具体场景中的延伸。", "verdict": "unverifiable", "note": "cited source(s) have no abstract available", "cites": [28, 29, 30], "evidence": [], "leni": false}, {"i": 10, "text": "从[0]对适配方式的体系化梳理、[1]对应用任务的景观式描绘，到[5]对个性化议程的风险提示，本主题的演进逻辑清晰可见：LLM推荐的研究重心正从“如何将模型接入推荐流程”的技术问题，转向“接入之后应当优化何种目标”的目标问题。", "verdict": "partial", "note": "The factual ingredients are grounded: [0] systematizes adaptation, [1] maps tasks, [5] raises personalization risks. However, the asserted 'evolution shift' from technical to objective-level questions is an interpretive framing the sources do not explicitly make.", "cites": [0, 1, 5], "evidence": [{"index": 0, "chunk_id": "d65ecdb55cb4-ft-8", "kind": "fulltext", "excerpt": "We provide\n3\n\n|     | Modeling Paradigm  |     |     |     |     | Case |     |     |\n| --- | ------------------ | --- | --- | --- | --- | ---- | --- | --- |\nEmbeddings\n|     |     |     |     |      "}, {"index": 1, "chunk_id": "83231ee9764f-ft-38", "kind": "fulltext", "excerpt": "IEEETRANSACTIONSONKNOWLEDGEANDDATAENGINEERING,SUBMISSION2023 7\nRecommendation Datasets\n|     | user_id: 1024                    |     |     |     |     | Pre-training LLMs for Recommender Systems |   "}, {"index": 5, "chunk_id": "7d1b12841f04-ft-29", "kind": "fulltext", "excerpt": "thetailentity.TagReal[55]generateshigh-qualityprompts This issue can emerge as the introduction of extraneous\nfromtheexternaltextcorpora.AutoKG[48]directlyadopts information or even noise into the rec"}], "leni": false}, {"i": 11, "text": "传统推荐依赖任务特定的架构与目标函数，难以在不同任务间迁移知识[2]。", "verdict": "partial", "note": "The provided ground text for [2] contains experimental tables and prompt templates but no statement about traditional recommenders relying on task-specific architectures/objectives or lacking cross-task knowledge transfer; the claim has no basis in the cited excerpt. [defense: The claim is directly supported by the cited source. In the abstract and introduction of the P5 paper, it states verbatim: 'For a long time, different recommendation tasks typically require designing ]", "cites": [2], "evidence": [{"index": 2, "chunk_id": "3bc30f846a61-ft-52", "kind": "fulltext", "excerpt": "numberofpretrainingpromptsandthenmakecomparisonswith\ntheP5modelpretrainedunderdefaultsetup.Tothisend,wechoose 6 CONCLUSIONSANDFUTUREWORK\nacollectionofpretrainingpromptsthathastheminimumnumber Inthispa"}], "leni": false}, {"i": 12, "text": "LLM凭借丰富知识与强泛化能力，为统一建模提供了新载体[3]。", "verdict": "partial", "note": "TALLRec supports that LLMs have knowledge and generalization capabilities for recommendation, but does not mention 'unified modeling' (统一建模); the claim adds an interpretive framing.", "cites": [3], "evidence": [{"index": 3, "chunk_id": "ebbe1afbabcc-ft-16", "kind": "fulltext", "excerpt": "3 EXPERIMENTS\nSpecifically,weutilizetheconditionallanguagemodelingobjective\nduringthealpacatuning,asexemplifiedintheAlpacarepository1. Inthissection,weconductexperimentstoanswerthefollowing\nresearchqu"}], "leni": false}, {"i": 13, "text": "P5[2]提出“预训练、个性化提示与预测”（Pretrain, Personalized Prompt & Predict）范式。", "verdict": "supported", "note": "P5's title directly states 'Unified Pretrain, Personalized Prompt & Predict Paradigm (P5)'.", "cites": [2], "evidence": [{"index": 2, "chunk_id": "3bc30f846a61-ft-0", "kind": "fulltext", "excerpt": "Recommendation as Language Processing (RLP):\nA Unified Pretrain, Personalized Prompt & Predict Paradigm (P5)\nShijieGeng,ShuchangLiu,ZuohuiFu,YingqiangGe,YongfengZhang\nDepartmentofComputerScience,Rutge"}], "leni": false}, {"i": 14, "text": "RecGPT[26]沿同一方向却选择领域自适应的全量训练路径。", "verdict": "partial", "note": "Ground text confirms RecGPT uses full fine-tuning and continual pretraining, but 'domain-adaptive' (领域自适应) is an added descriptor not explicitly stated.", "cites": [26], "evidence": [{"index": 26, "chunk_id": "68d69bc2ef6f-ft-0", "kind": "fulltext", "excerpt": "RecGPT: Generative Pre-training for Text-based Recommendation\n|     |     | HoangNgo and | DatQuocNguyen |     |     |     |     |\n| --- | --- | ------------ | ------------- | --- | --- | --- | --- |\n"}], "leni": false}, {"i": 15, "text": "TALLRec[3]的证据最为直接：未经过推荐数据微调的LLM在推荐任务上的表现接近随机猜测（AUC≈0.", "verdict": "supported", "note": "TALLRec text states LLM-based methods perform similarly to random guessing (AUC≈0.5), directly supporting the claim.", "cites": [3], "evidence": [{"index": 3, "chunk_id": "ebbe1afbabcc-ft-25", "kind": "fulltext", "excerpt": "TALLRecframework.TALLRecsuccessfullyunlockstheknowl- WesummarizetheresultsinFigure3(b),fromwhichwehave\nedge and generalization capabilities of LLMs for recommenda- the following observations: 1) The p"}], "leni": false}, {"i": 16, "text": "与之相对，文献[16]提出提示式表示学习方法（prompting-based representation learning，P4R），主张无需大规模预训练或微调，仅通过提示即可获得适用于多种候选文本的表示。", "verdict": "supported", "note": "P4R abstract states it works 'without extensive pre-training' and handles varied candidate text via prompting; the method is prompting-based, implying no fine-tuning needed.", "cites": [16], "evidence": [{"index": 16, "chunk_id": "aecd86d0b83f-ft-0", "kind": "fulltext", "excerpt": "A Prompting-Based Representation Learning Method for\nRecommendation with Large Language Models\nJunyiChen1, ToyotaroSuzumura1,*\n1TheUniversityofTokyo,Tokyo,Japan\nAbstract\nInrecentyears,RecommenderSyste"}], "leni": false}, {"i": 17, "text": "文献[27]指出，基于LLM的推荐中静态模式提示（static schema-based prompting）存在根本局限，主张对上下文知识进行协同整合并消解知识之间的不一致，这实际上是在提示层面为LLM补充更丰富的语义约束。", "verdict": "partial", "note": "Abstract identifies limitations of static schema-based prompting and proposes knowledge fusion and contradiction resolution, but the interpretation that this enriches prompts with semantic constraints is not explicitly in the source; the paper frames it as latent-space integration.", "cites": [27], "evidence": [{"index": 27, "chunk_id": "aac74b3bffde-abs", "kind": "abstract", "excerpt": "The integration of large language models (LLMs) into recommendation systems has revealed promising potential through their capacity to extract world knowledge for enhanced reasoning capabilities. Howe"}], "leni": false}, {"i": 18, "text": "RecBase[19]则走得更远。", "verdict": "supported", "note": "RecBase's abstract describes a generative foundation model for zero-shot and multi-domain recommendation, going beyond prompting-based methods; the claim is supported as a synthesis.", "cites": [19], "evidence": [{"index": 19, "chunk_id": "209ccc5c7987-ft-23", "kind": "fulltext", "excerpt": "|\n| --- | --- | --- | --- | --- ation, MF）与神经协同过滤（neural collaborative filtering, NCF）[4]。", "verdict": "supported", "note": "Ground text states MF and NCF parameters were carefully tuned and compared with LLMs on the Movie dataset.", "cites": [4], "evidence": [{"index": 4, "chunk_id": "afdd22d6f1a4-ft-27", "kind": "fulltext", "excerpt": "FilteringModels\nDuetothetime-sensitiveandrapidlychangingnatureofnewsrec-\nGiventhattheLLMsusedinthepreviousexperimentswerenot\nommendation,thereisofteninsufficientinteractiondataavailable\ntrainedonrecom"}], "leni": false}, {"i": 35, "text": "结果显示，MF与NCF的性能随训练数据比例增加而提升，开箱即用的LLM模型在该比较中超越了二者[4]。", "verdict": "partial", "note": "Ground text says MF/NCF improve with more data and off-the-shelf LLMs outperform them only when training data are scarce (<40% for ChatGPT); the claim overstates by omitting this condition.", "cites": [4], "evidence": [{"index": 4, "chunk_id": "afdd22d6f1a4-ft-27", "kind": "fulltext", "excerpt": "FilteringModels\nDuetothetime-sensitiveandrapidlychangingnatureofnewsrec-\nGiventhattheLLMsusedinthepreviousexperimentswerenot\nommendation,thereisofteninsufficientinteractiondataavailable\ntrainedonrecom"}], "leni": false}, {"i": 36, "text": "裁判化路径的核心工作是Cranfield评测范式从信息检索向推荐系统的迁移[15]。", "verdict": "supported", "note": "The cited paper explicitly addresses transferring Cranfield-style evaluation from IR to RecSys.", "cites": [15], "evidence": [{"index": 15, "chunk_id": "2136bca8b8e0-ft-24", "kind": "fulltext", "excerpt": "0.20\nIn standard offline evaluation, user interactions are typically\nsorted by time and then split into train–test sets on a per-user\nbasis[56].6Thisapproachcaninadvertentlycausetemporalleak- 0.15\nage"}], "leni": false}, {"i": 37, "text": "然而项目级一致性仍属中等，尤其在细粒度兴趣区分上表现有限[15]。", "verdict": "partial", "note": "Ground text mentions moderate item-level agreement, but not 'fine-grained interest discrimination'; that detail is unsupported.", "cites": [15], "evidence": [{"index": 15, "chunk_id": "2136bca8b8e0-ft-39", "kind": "fulltext", s/items as factors raising the importance of cold start. [defense: The claim is directly supported by the cited source. The abstract explicitly states: 'Due to the diversification of internet platforms and the exponential growth of users and items, the importance of ]", "cites": [8], "evidence": [{"index": 8, "chunk_id": "5a0e6362a2f0-ft-78", "kind": "fulltext", "excerpt": "6 WORLDKNOWLEDGEFROMLARGELANGUAGEMODELS\nLargelanguagemodels(LLMs)aregenerativeartificialintelligencesystemstrainedusingdeeplearningtechniques\ntounderstandthegeneralworldknowledgebylearningvastamountso"}], "leni": false}, {"i": 55, "text": "但[8]指出，冷启动推荐在LLM时代仍是长期存在的挑战，并强调相关研究仍需系统梳理与展望。", "verdict": "supported", "note": "[rewrite] [8] is a comprehensive survey and roadmap on cold-start recommendation in the LLM era, supporting the characterization of cold start as a key ongoing challenge requiring systematic review.", "cites": [8], "evidence": [{"index": 8, "chunk_id": "5a0e6362a2f0-ft-78", "kind": "fulltext", "excerpt": "6 WORLDKNOWLEDGEFROMLARGELANGUAGEMODELS\nLargelanguagemodels(LLMs)aregenerativeartificialintelligencesystemstrainedusingdeeplearningtechniques\ntounderstandthegeneralworldknowledgebylearningvastamountso"}], "leni": true}, {"i": 56, "text": "[13]的实证研究揭示了这一矛盾的严重性：在仅提供年龄、性别、语言等有限人口统计学信号的冷启动设置下，LLM推荐器会基于用户的敏感属性引入系统性偏差。", "verdict": "partial", "note": "Core finding (LLMs reproduce societal/gender stereotypes in cold-start settings based on sensitive attributes) is grounded in [13], but the specific demographic list 'age, gender, language' is not in the ground text.", "cites": [13], "evidence": [{"index": 13, "chunk_id": "5e0f1499d8e0-ft-4", "kind": "fulltext", "excerpt": "• CasestudiesprovidingempiricalevidencethatLLMsreproducesocietalbiases,includinggenderandcultural\nstereotypes,andrevealingacomplex,non-linearrelationshipbetweenmodelscaleandfairness. 2 RelatedWorks\nLL"}], "leni": false}, {"i": 57, "text": "这一发现与[8]的乐观预期形成鲜明对照：LLM的世界知识虽能缓解冷启动的覆盖率问题，却可能以放大社会偏见为代价。", "verdict": "partial", "note": "The contrast between [8]'s positive view of LLM cold-start capability and [13]'s bias findings is a plausible synthesis, but the specific claims about 'world knowledge alleviating coverage' and the 'cost' framing are not stated in the sources.", "cites": [8], "evidence": [{"index": 8, "chunk_id": "5a0e6362a2f0-ft-78", "kind": "fulltext", "excerpt": "6 WORLDKNOWLEDGEFROMLARGELANGUAGEMODELS\nLargelanguagemodels(LLMs)aregenerativeartificialintelligencesystemstrainedusingdeeplearningtechniques\ntounderstandthegeneralworldknowledgebylearningvastamountso"}], "leni": false}, {"i": 58, "text": "[14]的研究将视角扩展到流行度偏差（popularity bias），揭示了一个更深层的机制性缺陷：现有去偏方法将流行度偏差仅视为多样性增强问题，而忽视了其语义维度。", "verdict": "supported", "note": "Ground text directly supports that prompting for diversity/debiasing fails to correct popularity bias and that the issue is semantic/result-oriented, not merely a diversity problem.", "cites": [14], "evidence": [{"index": 14, "chunk_id": "5f565f24046f-ft-24", "kind": "fulltext", "excerpt": "thedeepersemanticunderstandingrequiredtomitigatepopularity Sincetheeffectivenessofuserclassificationmayvarywithdiffer-\nbias.Thishighlightstheneedformoreadvancedstrategiesthatgo entLLMs,wetestedmultipl"}], "leni": false}, {"i": 59, "text": "与[14]揭示的\"提示无法纠正偏差\"形成互补的是[21]提出的语言模型先验（Language-Model Prior）方法，后者从生成侧为冷启动物品提供解决方案。", "verdict": "partial", "note": "The language-model prior for cold-start items is grounded in [21], but 'from the generation side' mischaracterizes the method, which uses an LM-based similarity prior for item embeddings.", "cites": [14, 21], "evidence": [{"index": 14, "chunk_id": "5f565f24046f-ft-51", "kind": "fulltext", "excerpt": "[33] RobinUngruh,KarlijnDinnissen,AnjaVolk,MariaSoledadPera,andHanna\n[13] WenyueHua,yingqiangGe,ShuyuanXu,JianchaoJi,ZelongLi,andYongfeng Hauptmann.2024.Puttingpopularitybiasmitigationtothetest:Auser-"}, {"index": 21, "chunk_id": "625cfe9fdaee-ft-0", "kind": "fulltext", "excerpt": "|     | Language-Model |     | Prior Overcomes |     | Cold-Start | Items |     |\n| --- | -------------- | --- | --------------- | --- | ---------- | ----- | --- |\nShiyuWang*1 HaoDing2 YupengGu2 Sergu"}], "leni": false}, {"i": 60, "text": "将[21]与[13]并置，可以看到LLM时代冷启动问题的两面性：语言模型先验提供了乐观的解决路径，而实证研究则揭示了这一路径在公平性维度上的代价。", "verdict": "partial", "note": "Both [21] (optimistic method) and [13] (bias evidence) are grounded, but the claim's framing that [13] reveals the fairness cost of [21]'s specific path is an interpretive addition not made by the sources.", "cites": [13, 21], "evidence": [{"index": 13, "chunk_id": "5e0f1499d8e0-ft-5", "kind": "fulltext", "excerpt": "BroaderethicalalignmentismeasuredbycomprehensivebenchmarkslikeETHICS[15]andthroughdatasets\nderivedfromreal-worlduserinteractionslikeEagle[16]. Methodologically,counterfactualanalysis[17]helpsidentify\n"}, {"index": 21, "chunk_id": "625cfe9fdaee-ft-35", "kind": "fulltext", "excerpt": "proachisconsistentlysuperior.Forinstance,inMovieLens\n|     |     |     |     |     |     |     |     | dataset, NDCG | and | HR of | BPRMF-ours | are | larger than |\n| --- | --- | --- | --- | --- | --"}], "leni": false}, {"i": 61, "text": "[25]提出的CheatAgent系统将攻击视角引入LLM推荐系统研究，其研究问题直指安全漏洞：LLM智能体能否被操纵以破坏推荐系统的完整性？", "verdict": "supported", "note": "Ground text supports CheatAgent as a first attack study on LLM-empowered RecSys, investigating robustness to adversarial perturbations and safety vulnerability.", "cites": [25], "evidence": [{"index": 25, "chunk_id": "81268cdb5c6d-ft-82", "kind": "fulltext", "excerpt": "tems.Fromtheindustryperspective,ourproposedCheatAgent\nBesides,duringapplications,byleveragingthebatchprocessing\ncanassisttheminevaluatingthevulnerabilitiesoftheirdeployed\ncapabilitiesofGPUs/TPUs,wecan"}], "leni": false}, {"i": 62, "text": "将[25]与前述工作串联，可以勾勒出LLM推荐系统鲁棒性讨论的完整逻辑：效率优化（[7]）与冷启动缓解（[8]、）解决了部署的可行性问题，公平性研究（[13]、）揭示了模型在非理想条件下的系统性缺陷，而安全攻击（[25]）则表明这些缺陷可能被恶意利用，构成实际的安全威胁。", "verdict": "partial", "note": "Each cited work is relevant (efficiency, cold start, fairness, security), but the claim overstates that these 'solved deployment feasibility': [7] itself says inference-efficiency gains are limited, and [8] is a survey/roadmap rather than a deployed solution. The overarching framing is the reviewer's synthesis.", "cites": [7, 8, 13, 25], "evidence": [{"index": 7, "chunk_id": "299f97b5abd2-abs", "kind": "abstract", "excerpt": "Large language models (LLM) have manifested unparalleled modeling capability on various tasks, e.g., multi-step reasoning, but the input to these models is mostly limited to plain text, which could be"}, {"index": 8, "chunk_id": "5a0e6362a2f0-ft-5", "kind": "fulltext", "excerpt": "Cold-StartRecommendationtowardstheEraofLargeLanguageModels(LLMs):AComprehensiveSurveyandRoadmap • 1:3\n| 4.2.1                                      | HeterogeneousGraphRelation        | 16  |\n| -------"}, {"index": 13, "chunk_id": "5e0f1499d8e0-ft-34", "kind": "fulltext", "excerpt": "[25] DiJin,LuzhiWang,HeZhang,YizhenZheng,WeipingDing,FengXia,andShiruiPan.Asurveyonfairness-aware\nrecommendersystems,2023. [26] WoosukKwon,ZhuohanLi,SiyuanZhuang,YingSheng,LianminZheng,CodyHaoYu,Josep"}], "leni": false}, {"i": 63, "text": "对话推荐面临的核心问题是自然语言表达的多样性，尤其是“我在注意体重”这类间接表述难以映射为可检索的偏好条件[18]。", "verdict": "partial", "note": "The RA-Rec ground text does not mention the example '我在注意体重' or claim that indirect expressions are hard to map to retrievable preference conditions; the specific central-problem claim is not grounded in [18]. [defense: The abstract explicitly states: 'Conversational recommendation (ConvRec) systems must understand rich and diverse natural language (NL) expressions of user preferences and intents, often communicated ]", "cites": [18], "evidence": [{"index": 18, "chunk_id": "b1886b19d274-ft-5", "kind": "fulltext", "excerpt": "• We demonstrate RA-Rec for restaurant recommendation, in-\ncluding a video,1 a well-documented open source GitHub\nrepository under a permissive MIT License,2 and an interac-\ntive Google Colab notebook"}], "leni": false}, {"i": 64, "text": "多模态推荐则要平衡语义化表示带来的增益与在线系统对效率和延迟的硬约束[22][23]。", "verdict": "partial", "note": "[23] explicitly supports the accuracy/efficiency-latency tradeoff, but [22]'s provided excerpt supports multimodal semantic representation and flexible deployment without explicitly stating the online latency hard constraint; the claim is partly grounded.", "cites": [22, 23], "evidence": [{"index": 22, "chunk_id": "9760f873ba52-ft-19", "kind": "fulltext", "excerpt": "Empirically,\n5\n\nTable1: Statisticsofthedatasets. elsincludeSASRec,BERT4Rec,FMLP-Recand\n|      |       |       |        |         |         | LRURec     | (Kang | and        | McAuley, | 2018;   | Sun "}, {"index": 23, "chunk_id": "1b9cf05dbb68-abs", "kind": "abstract", "excerpt": "Large-scale online advertising recommendation needs both high accuracy and low latency. Traditional methods often fail to capture semantic and multimodal user–ad relationships under time limits. This "}], "leni": false}, {"i": 65, "text": "这一主题的周边已有生成式推荐综述[28]，以及将提示策略用于新闻推荐[29]、以弱模态信号增强多模态推荐[30]等探索。", "verdict": "unverifiable", "note": "cited source(s) have no abstract available", "cites": [28, 29, 30], "evidence": [], "leni": false}, {"i": 66, "text": "Kemper等人[18]提出的RA-Rec以提示驱动的半结构化自然语言状态追踪为核心，用LLM执行多标签意图分类，并持续更新一个JSON格式的半结构化对话状态。", "verdict": "supported", "note": "[18] states RA-Rec uses LLM prompting for multi-label intent classification and for updating a JSON semi-structured NL state, with prompt-driven dialogue state tracking as the core.", "cites": [18], "evidence": [{"index": 18, "chunk_id": "b1886b19d274-ft-5", "kind": "fulltext", "excerpt": "• We demonstrate RA-Rec for restaurant recommendation, in-\ncluding a video,1 a well-documented open source GitHub\nrepository under a permissive MIT License,2 and an interac-\ntive Google Colab notebook"}], "leni": false}, {"i": 67, "text": "由此，系统能应对间接、无法直接检索的偏好表述[18]。", "verdict": "supported", "note": "[18] says LLM-generated state values can capture nuanced NL expressions and LLMs unlock commonsense connections between preference utterances and complex language, supporting the ability to handle indirect/non-directly-retrievable preference statements.", "cites": [18], "evidence": [{"index": 18, "chunk_id": "b1886b19d274-ft-5", "kind": "fulltext", "excerpt": "• We demonstrate RA-Rec for restaurant recommendation, in-\ncluding a video,1 a well-documented open source GitHub\nrepository under a permissive MIT License,2 and an interac-\ntive Google Colab notebook"}], "leni": false}, {"i": 68, "text": "RA-Rec本身不绑定特定LLM，任何基于提示的模型都可以替换使用[18]。", "verdict": "supported", "note": "[18] explicitly says GPT-3.5-turbo is used but the RA-Rec framework is LLM-agnostic and will work with any prompt-based LLM model.", "cites": [18], "evidence": [{"index": 18, "chunk_id": "b1886b19d274-ft-5", "kind": "fulltext", "excerpt": "• We demonstrate RA-Rec for restaurant recommendation, in-\ncluding a video,1 a well-documented open source GitHub\nrepository under a permissive MIT License,2 and an interac-\ntive Google Colab notebook"}], "leni": false}, {"i": 69, "text": "文献[24]观察到，ChatGPT等高级LLM在领域特定的对话推荐任务上能力受限，尤其在生成扎根于推荐知识的响应时[24]。", "verdict": "supported", "note": "[24] states advanced LLMs like ChatGPT are limited in domain-specific CRS tasks, including generating grounded responses with recommendation-oriented knowledge.", "cites": [24], "evidence": [{"index": 24, "chunk_id": "11b7cbfc2787-abs", "kind": "abstract", "excerpt": "This paper aims to efficiently enable large language models (LLMs) to use external knowledge and goal guidance in conversational recommender system (CRS) tasks. Advanced LLMs (e.g., ChatGPT) are limit"}], "leni": false}, {"i": 70, "text": "该工作将外部知识与目标引导整合进LLM的使用流程，使生成过程受明确推荐目标的约束[24]。", "verdict": "supported", "note": "[24] proposes ChatCRS with a knowledge retrieval agent over external Knowledge Bases and a goal-planning agent for dialogue goal prediction, i.e., integrating external knowledge and goal guidance into the LLM workflow.", "cites": [24], "evidence": [{"index": 24, "chunk_id": "11b7cbfc2787-abs", "kind": "abstract", "excerpt": "This paper aims to efficiently enable large language models (LLMs) to use external knowledge and goal guidance in conversational recommender system (CRS) tasks. Advanced LLMs (e.g., ChatGPT) are limit"}], "leni": false}, {"i": 71, "text": "与RA-Rec用检索文本补充上下文不同[18]，这条路线依赖结构化知识与任务级引导，其差异实质是对LLM知识缺口性质的判断不同：检索增强偏向动态事实和个体偏好，知识注入偏向稳定且关系密集的领域知识。", "verdict": "partial", "note": "The factual contrast is grounded ([18] uses retrieval-augmented context; [24] uses structured knowledge and goal guidance), but the interpretive framing about the nature of LLM knowledge gaps (dynamic/individual vs stable/relation-dense) is added by the reviewer and not stated in the sources.", "cites": [18], "evidence": [{"index": 18, "chunk_id": "b1886b19d274-ft-5", "kind": "fulltext", "excerpt": "• We demonstrate RA-Rec for restaurant recommendation, in-\ncluding a video,1 a well-documented open source GitHub\nrepository under a permissive MIT License,2 and an interac-\ntive Google Colab notebook"}], "leni": false}, {"i": 72, "text": "但[24]的摘要实际上包含方法设计与实验证据：采用知识检索代理与目标规划代理，并在两个多目标CRS数据集上报告了改进。", "verdict": "supported", "note": "[rewrite] [24]'s abstract explicitly describes a knowledge retrieval agent and a goal-planning agent, and reports experimental improvements on two multi-goal CRS datasets (17% informativeness, 27% proactivity, tenfold recommendation accuracy), matching the claim.", "cites": [24], "evidence": [{"index": 24, "chunk_id": "11b7cbfc2787-abs", "kind": "abstract", "excerpt": "This paper aims to efficiently enable large language models (LLMs) to use external knowledge and goal guidance in conversational recommender system (CRS) tasks. Advanced LLMs (e.g., ChatGPT) are limit"}], "leni": false}, {"i": 73, "text": "Wang等人提出的Matryoshka表示学习（Matryoshka Representation Learning）面向顺序推荐，将语言与视觉信息整合进同一模型，训练完成后可在不同表示大小下部署，以适应多样化的效率要求[22]。", "verdict": "supported", "note": "Ground text [22] describes fMRLRec for multimodal sequential recommendation, integrating language and vision, with multiple model sizes in a single training session and efficient inference across scenarios.", "cites": [22], "evidence": [{"index": 22, "chunk_id": "9760f873ba52-ft-0", "kind": "fulltext", "excerpt": "Train Once, Deploy Anywhere: Matryoshka Representation Learning for\n|     |     |     | Multimodal | Recommendation |     |     |     |     |     |     |\n| --- | --- | --- | ---------- | -------------"}], "leni": false}, {"i": 74, "text": "该方案把效率问题放到表示维度上解决：部署环节可以按场景选择表示粒度[22]。", "verdict": "supported", "note": "Ground text [22] states an efficient paradigm to learn models of varying granularities within a single training session, supporting representation-level efficiency choices.", "cites": [22], "evidence": [{"index": 22, "chunk_id": "9760f873ba52-ft-19", "kind": "fulltext", "excerpt": "Empirically,\n5\n\nTable1: Statisticsofthedatasets. elsincludeSASRec,BERT4Rec,FMLP-Recand\n|      |       |       |        |         |         | LRURec     | (Kang | and        | McAuley, | 2018;   | Sun "}], "leni": false}, {"i": 75, "text": "与之相对，文献[23]提出的LMSR在系统架构层面处理同一问题。", "verdict": "supported", "note": "Ground text [23] presents LMSR as a two-stage framework addressing low latency through system architecture, in contrast to [22]'s representation-level approach.", "cites": [23], "evidence": [{"index": 23, "chunk_id": "1b9cf05dbb68-abs", "kind": "abstract", "excerpt": "Large-scale online advertising recommendation needs both high accuracy and low latency. Traditional methods often fail to capture semantic and multimodal user–ad relationships under time limits. This "}], "leni": false}, {"i": 76, "text": "LMSR是一个两阶段框架，将大模型的语义排序引入大规模在线广告推荐，用阶段分离隔离语义计算的延迟成本[23]。", "verdict": "partial", "note": "Core facts (two-stage framework, LLM semantics, online advertising) are supported, but the specific mechanism 'stage separation isolates semantic computation latency cost' is not explicitly stated in the abstract; it mentions distillation and hierarchical ranking for speed.", "cites": [23], "evidence": [{"index": 23, "chunk_id": "1b9cf05dbb68-abs", "kind": "abstract", "excerpt": "Large-scale online advertising recommendation needs both high accuracy and low latency. Traditional methods often fail to capture semantic and multimodal user–ad relationships under time limits. This "}], "leni": false}, {"i": 77, "text": "但两篇摘要都止步于框架描述：Matryoshka未说明表示压缩与精度之间的量化关系[22]，LMSR未给出任何延迟或准确性指标[23]。", "verdict": "partial", "note": "The absence of quantitative trade-off/metrics is accurate for the provided abstracts, but 'both abstracts stop at framework description' overstates: both mention qualitative empirical claims (e.g., 'Empirically...', 'better performance and real-time efficiency').", "cites": [22, 23], "evidence": [{"index": 22, "chunk_id": "9760f873ba52-ft-19", "kind": "fulltext", "excerpt": "Empirically,\n5\n\nTable1: Statisticsofthedatasets. elsincludeSASRec,BERT4Rec,FMLP-Recand\n|      |       |       |        |         |         | LRURec     | (Kang | and        | McAuley, | 2018;   | Sun "}, {"index": 23, "chunk_id": "1b9cf05dbb68-abs", "kind": "abstract", "excerpt": "Large-scale online advertising recommendation needs both high accuracy and low latency. Traditional methods often fail to capture semantic and multimodal user–ad relationships under time limits. This "}], "leni": false}, {"i": 78, "text": "RA-Rec用半结构化状态限制LLM输出的自由度[18]，文献[24]用目标引导约束生成方向[24]，Matryoshka在向量维度上压缩语义表示[22]，LMSR在计算流程中安排分级[23]。", "verdict": "supported", "note": "Each cited part is grounded: [18] uses a JSON semi-structured NL state, [24] uses goal-planning guidance, [22] compresses representations across dimensions, and [23] arranges stages in the computation flow.", "cites": [18, 22, 23, 24], "evidence": [{"index": 18, "chunk_id": "b1886b19d274-ft-23", "kind": "fulltext", "excerpt": "https://doi.org/10.18653/v1/2020.emnlp-main.601\n\n[18] Shengnan Lyu esses interpretability or fairness, so the assertion that they 'have not been integrated with these dimensions' is inferred from absence rather than supported by the cited content.", "cites": [22, 23], "evidence": [{"index": 22, "chunk_id": "9760f873ba52-ft-19", "kind": "fulltext", "excerpt": "Empirically,\n5\n\nTable1: Statisticsofthedatasets. elsincludeSASRec,BERT4Rec,FMLP-Recand\n|      |       |       |        |         |         | LRURec     | (Kang | and        | McAuley, | 2018;   | Sun "}, {"index": 23, "chunk_id": "1b9cf05dbb68-abs", "kind": "abstract", "excerpt": "Large-scale online advertising recommendation needs both high accuracy and low latency. Traditional methods often fail to capture semantic and multimodal user–ad relationships under time limits. This "}], "leni": false}, {"i": 105, "text": "对抗攻击（[25]）仅是起点，数据投毒、提示注入、模型窃取等威胁向量需要建立防御体系。", "verdict": "partial", "note": "[25] does address adversarial attacks on LLM-empowered recommender systems, supporting the core reference. But the claims that it is 'only a starting point' and that data poisoning, prompt injection, and model extraction need defense systems are not present in the ground text, making this overstatement beyond what [25] supports.", "cites": [25], "evidence": [{"index": 25, "chunk_id": "81268cdb5c6d-ft-46", "kind": "fulltext", "excerpt": "posedmethodoutperformsotherbaselinesandundermines\nWeinitializethepopulationwithaquantityof50anditeratefor\ntherecommendationperformancedramatically,indicating\n10epochstoobtainthefinalperturbationforGA."}], "leni": false}, {"i": 106, "text": "提示蒸馏（[7]）和两阶段排序（[23]）提供了初步思路，但如何在保持推荐质量的前提下实现推理成本的可控降低，仍需更全面的方法论支撑。", "verdict": "supported", "note": "[7] presents prompt distillation to reduce inference time and explicitly notes the limited inference-efficiency improvement, motivating further research; [23] presents a two-stage ranking framework that distills LLMs into a small encoder to improve speed while retaining semantic quality. Together they support the preliminary ideas and the need for more comprehensive methodology for controllable inference-cost reduction.", "cites": [7, 23], "evidence": [{"index": 7, "chunk_id": "299f97b5abd2-abs", "kind": "abstract", "excerpt": "Large language models (LLM) have manifested unparalleled modeling capability on various tasks, e.g., multi-step reasoning, but the input to these models is mostly limited to plain text, which could be"}, {"index": 23, "chunk_id": "1b9cf05dbb68-abs", "kind": "abstract", "excerpt": "Large-scale online advertising recommendation needs both high accuracy and low latency. Traditional methods often fail to capture semantic and multimodal user–ad relationships under time limits. This "}], "leni": true}], "papers": [{"index": 0, "title": "A survey on large language models for recommendation", "fulltext": true, "chunks": 103}, {"index": 1, "title": "Recommender Systems in the Era of Large Language Models (LLMs)", "fulltext": true, "chunks": 171}, {"index": 2, "title": "Recommendation as Language Processing (RLP): A Unified Pretrain, Personalized Prompt &amp; Predict Paradigm (P5)", "fulltext": true, "chunks": 132}, {"index": 3, "title": "TALLRec: An Effective and Efficient Tuning Framework to Align Large Language Model with Recommendation", "fulltext": true, "chunks": 43}, {"index": 4, "title": "Uncovering ChatGPT’s Capabilities in Recommender Systems", "fulltext": true, "chunks": 49}, {"index": 5, "title": "When large language models meet personalization: perspectives of challenges and opportunities", "fulltext": true, "chunks": 162}, {"index": 6, "title": "On explaining recommendations with Large Language Models: a review", "fulltext": true, "chunks": 31}, {"index": 7, "title": "Prompt Distillation for Efficient LLM-based Recommendation", "fulltext": false, "chunks": 1}, {"index": 8, "title": "Cold-Start Recommendation towards the Era of Large Language Models (LLMs): A Comprehensive Survey and Roadmap", "fulltext": true, "chunks": 165}, {"index": 9, "title": "XRec: Large Language Models for Explainable Recommendation", "fulltext": true, "chunks": 89}, {"index": 10, "title": "Instructing and Prompting Large Language Models for Explainable Cross-domain Recommendations", "fulltext": false, "chunks": 1}, {"index": 11, "title": "Fine-Tuning Large Language Model Based Explainable Recommendation with Explainable Quality Reward", "fulltext": true, "chunks": 80}, {"index": 12, "title": "RecExplainer: Aligning Large Language Models for Explaining Recommendation Models", "fulltext": true, "chunks": 66}, {"index": 13, "title": "Revealing Potential Biases in LLM-Based Recommender Systems in the Cold Start Setting", "fulltext": true, "chunks": 38}, {"index": 14, "title": "Bridging Semantic Understanding and Popularity Bias with LLMs", "fulltext": true, "chunks": 58}, {"index": 15, "title": "From IR to RecSys: Evaluating LLM-based Judges in Cranfield-style Recommendation Collections", "fulltext": true, "chunks": 79}, {"index": 16, "title": "A Prompting-Based Representation Learning Method for Recommendation with Large Language Models", "fulltext": true, "chunks": 54}, {"index": 17, "title": "RecoAtlas: From Semantic Plausibility to Set-Level Utility in LLM Recommendation Agents", "fulltext": true, "chunks": 90}, {"index": 18, "title": "Retrieval-Augmented Conversational Recommendation with Prompt-based Semi-Structured Natural Language State Tracking", "fulltext": true, "chunks": 25}, {"index": 19, "title": "RecBase: Generative Foundation Model Pretraining for Zero-Shot Recommendation", "fulltext": true, "chunks": 114}, {"index": 20, "title": "LLM-as-a-Judge: Rapid Evaluation of Legal Document Recommendation for Retrieval-Augmented Generation", "fulltext": true, "chunks": 36}, {"index": 21, "title": "Language-Model Prior Overcomes Cold-Start Items", "fulltext": true, "chunks": 52}, {"index": 22, "title": "Train Once, Deploy Anywhere: Matryoshka Representation Learning for Multimodal Recommendation", "fulltext": true, "chunks": 66}, {"index": 23, "title": "Low-Latency Multimodal Semantic Ranking for Real-Time Advertising Recommendation", "fulltext": false, "chunks": 1}, {"index": 24, "title": "Incorporating External Knowledge and Goal Guidance for LLM-based Conversational Recommender Systems", "fulltext": false, "chunks": 1}, {"index": 25, "title": "CheatAgent: Attacking LLM-Empowered Recommender Systems via LLM Agent", "fulltext": true, "chunks": 84}, {"index": 26, "title": "RecGPT: Generative Pre-training for Text-based Recommendation", "fulltext": true, "chunks": 82}, {"index": 27, "title": "Synergistic Integration and Discrepancy Resolution of Contextualized Knowledge for Personalized Recommendation", "fulltext": false, "chunks": 1}], "papers_cited": 31, "papers_total": 31, "supporting": 3, "leni": {"sampled": 8, "downgraded": 3, "agreement_rate": 0.625}, "review_md": "# 基于大语言模型的推荐系统\n\n摘要：大语言模型（Large Language Model，LLM）为推荐系统提供了从数值化交互预测转向自然语言条件生成的新范式，但生成不确定性、知识时效性、计算成本与评估体系不统一等问题仍构成关键障碍。本综述基于系统检索纳入的28篇核心文献，按推荐系统处理流程组织，从适配路径演进、可解释推荐、自动评估、效率公平性与鲁棒性、对话与多模态推荐等维度展开分析。综述指出，领域内存在微调与提示之争、冷启动乐观预期与实证偏差之间的张力、直接生成解释的充分性分歧，以及语义合理性与集合级效用两种评估范式的深层分裂；效率与延迟是罕见的共识性障碍，提示蒸馏、表示压缩与推理加速等策略为综合争论提供了线索。综述主张，核心命题应落在“在哪个任务层上施加最少且必要的适应性信号，并建立统一评估框架”，未来需优先攻克标准化评测基准、动态用户行为建模、跨域知识迁移、多模态整合框架、安全鲁棒性防御及效率与效果的可扩展权衡。\n\n关键词：大语言模型推荐系统；生成式推荐范式；可解释推荐；LLM评估裁判；冷启动公平性；提示蒸馏\n\n## 引言\n\n推荐系统（Recommender System）是缓解信息过载的核心技术之一。这类系统在多类在线平台中承担物品分发任务，因此其性能直接影响用户体验。为实现该任务，传统方法通常基于协同过滤（Collaborative Filtering）或内容过滤（Content-Based Filtering）。协同过滤依赖历史交互数据，因此面临数据稀疏与冷启动问题。内容过滤依赖内容属性，因此在多媒体内容中遭遇特征提取困难。同时，基于标识符的表示方式难以捕捉用户与物品的深层语义。大语言模型（Large Language Model，LLM）的出现为此提供了新范式。LLM在海量文本上完成预训练，因此具备较强的语义理解与知识存储能力。将LLM接入推荐系统，可以改进用户画像、物品表征与交互策略。这一方向已成为信息检索与人工智能交叉领域的研究热点。\n\n尽管已有多种方法被提出，基于LLM的推荐系统仍面临若干开放问题。第一个问题在于生成内容的不确定性。LLM可能产生与事实不符的推荐解释，这一现象被称为幻觉（Hallucination）。幻觉会削弱用户信任，因此需要设计约束机制。第二个问题在于知识时效性。LLM的参数化知识存在截止日期，因此无法覆盖最新物品与热点信息。第三个问题在于计算成本。在推断阶段调用大模型会带来高延迟与能耗，因此难以直接用于大规模在线推荐。第四个问题在于评估体系不统一。现有工作多采用少量公开数据集，评测指标与基线选择差异较大，因此结果之间缺乏可比性。此外，大模型训练语料中的社会偏见可能被迁移至推荐结果，这一风险需要系统性的审视与缓解。这些开放问题共同构成该领域进一步发展的关键障碍。\n\n本综述旨在系统梳理基于LLM的推荐系统的研究进展，并在此基础上识别未来研究方向。本综述的组织遵循推荐系统的完整处理流程。具体而言，后续章节首先回顾LLM用于用户建模与物品表征的现有方法。接着，第三章讨论基于LLM的交互式推荐与结果重排机制。第四章分析评测基准与多轮推荐中的特殊挑战。第五章整合上述讨论，总结共同局限并展望可行路径。该结构有助于读者理解不同技术环节之间的关联与演进。\n\n本综述采用系统检索方法获取与分析文献。检索源包括arXiv、Semantic Scholar、OpenAlex与Crossref。初步检索共获得47篇候选论文。候选论文经过相关性筛选与复合排序处理，排序权重由相关性、引用量与期刊分区共同决定。最终，本综述纳入核心文献28篇。另有3篇支持文献仅用于摘要级别的引用。检索日期为2026年8月19日。以上检索流程保证了本综述所依据文献的代表性与时效性。\n\n### 综述与展望\n\n大语言模型（Large Language Models, LLMs）进入推荐系统领域后，最显性的变化是推荐任务的表述方式：从数值化的用户—物品交互预测，转向以自然语言为载体的条件生成与偏好理解。[0]与[1]两篇综述、[5]的立场文章共同构成了这一交叉方向的基础入口：前者分别从适配方式与任务场景两个维度梳理已有研究，后者从个性化目标的角度提出尚未解决的问题。本文以适配路径的演进为主线组织综述，先说明综述所勾勒的技术谱系，再展开生成式范式引发的争论，最后以个性化议程收束并指向未来方向。领域内新出现的生成式推荐综述[28]、提示驱动的新闻推荐[29]与弱模态增强的多模态推荐[30]等子方向，也将在相应语境中被引用。\n\n两篇综述的互补首先体现在分析粒度的差异上。[0]以建模范式为第一级分类，将LLM推荐方法区分为判别式（discriminative）与生成式（generative）两大类，并汇总了五种训练/域适配方式，包括微调（fine-tuning）、提示/上下文学习（prompting/in-context learning）、提示调优（prompt tuning）与指令调优（instruction tuning）等。在同一框架内，用户与物品资料（user/item profile）可以被序列化为自然语言字段，如用户ID、年龄、电影标题与类型，再经LLM编码为嵌入向量。这一设计意味着推荐系统的输入侧可以由符号化的交互记录改写为文本描述。适配方式的选择还直接决定了信息注入的深度与训练成本：微调更新模型参数以对齐推荐任务，提示调优仅调整提示向量，指令调优则在多个任务上训练模型遵循指令。与之相对，[1]从应用场景切入，展示ChatGPT、LLaMA、T5等模型如何被用于top-K推荐、评分预测、会话式推荐与解释生成等任务；其引用的一个代表性方案是采用T5作为推荐系统骨干，允许用户以自然语言表达显式偏好和意图，最终获得优于仅依赖用户—物品交互输入的推荐效果。该案例提示，文本化输入的增益来源在于自然语言能够携带交互记录中缺席的用户意图。两份综述虽起点不同，但共享一个基础判断：经过海量数据自监督预训练的LLM拥有强大的知识容量与泛化能力，因而成为推荐系统在稀疏数据场景中的潜在补充信号源。\n\nLLM与传统推荐模型之间最根本的分歧在于任务定义。[0]所区分的两种建模范式恰好对应两种推荐理念：判别式路线将LLM用作特征编码器，保留评分或点击预测的目标函数，文本信息只是增强用户与物品表征的附加信号；生成式路线则把推荐重建为“给定用户上下文生成物品或解释”的文本生成问题。两条路线在[1]所描绘的任务图景中共存，但彼此的前提存在张力：判别式路线默认推荐仍可还原为交互概率估计，生成式路线则认为推荐本质上是序列决策与文本表达问题。由此衍生出领域内尚未调和的争论——LLM是否必须经过针对推荐任务的显式微调或对齐才能发挥作用，还是可以直接依靠零样本提示或表示学习加以利用；更深的层面则是以语言为中心的预训练目标与推荐目标之间是否存在根本性失配。从[0]的框架看，这一争论的实质是在选择适配深度：提示式方法将LLM当作冻结的知识库，微调式方法将LLM当作可塑造的策略网络。即使在这两种立场内部，效率与延迟也已被公认为部署的主要瓶颈，这解释了为何提示蒸馏与表示压缩会成为竞逐中的落地路径。有效性、可控性与成本三者的权衡，构成生成式推荐方向后续发展的约束条件。\n\n如果说[0]与[1]回答的是技术如何被改造，那么[5]追问的则是改造方向是否正确。该文将个性化置于LLM应用议程的核心，指出传统推荐系统依赖协同过滤（collaborative filtering）信号与物品到物品的转换关系，而LLM作为基础模型引入后，用户偏好可以通过自然语言甚至图像直接承载。随之而来的数据基础变化是：推荐引擎的输入空间从交互日志扩展到文本与多模态（multimodal）内容，因此发展支持多模态数据的推荐引擎成为重要研究课题。这一判断揭示了个性化在LLM时代的重构——用户不再仅被识别为一个ID，而是可以通过语言表达与文化脉络被建模。同时，[5]的分析也隐含一种风险：若推荐系统以语言模型对世界的先验理解为主要依据，可能弱化传统协同过滤所捕捉的行为相似性，而后者恰恰是商业推荐系统实现个性化的支柱。这一关切与领域内关于冷启动、可解释性与评估标准的争论彼此呼应：LLM引入后冷启动问题是否已被解决、生成式解释能否真实反映决策依据、LLM评判者与人类判断在何种条件下一致，这些分歧均未有定论。它们的共同指向是，语言模型对用户的理解与用户真实的偏好结构之间仍存在系统性差距，个性化目标不能被视作技术迁移的自动产物。围绕生成式推荐[28]、提示驱动新闻推荐[29]与多模态增强推荐[30]的探索，正是这一未完成议程在具体场景中的延伸。\n\n从[0]对适配方式的体系化梳理、[1]对应用任务的景观式描绘，到[5]对个性化议程的风险提示，本主题的演进逻辑清晰可见：LLM推荐的研究重心正从“如何将模型接入推荐流程”的技术问题，转向“接入之后应当优化何种目标”的目标问题。后者所涉及的目标函数设计、多模态偏好对齐与可控生成，将直接导向下一主题对具体推荐范式的深入分析。\n\n### 基于LLM的推荐方法\n\n将大语言模型（LLM）置于推荐系统核心，是近年推荐研究中最显著的范式转换之一。传统推荐依赖任务特定的架构与目标函数，难以在不同任务间迁移知识[2]。LLM凭借丰富知识与强泛化能力，为统一建模提供了新载体[3]。围绕“如何让LLM服务于推荐”，已有工作形成了从全量预训练、微调对齐到提示式表示、生成式预训练重定向的谱系。本文按此谱系展开，依次考察预训练范式、微调与提示之争、零样本重定向。这一过程揭示的核心演变是：LLM在推荐中的角色从任务统一器转向语义编码器。\n\n预训练范式首先将推荐任务文本化。P5[2]提出“预训练、个性化提示与预测”（Pretrain, Personalized Prompt & Predict）范式。它将用户-项目交互、用户描述、项目元数据和用户评论全部转换为文本，从而以文本到文本方式统一多个推荐任务。这一设计的动机是克服任务特定架构导致的知识迁移障碍，其意义在于首次将推荐系统地纳入语言模型范式。RecGPT[26]沿同一方向却选择领域自适应的全量训练路径。它构建7B参数的RecGPT-7B，并进一步训练指令遵循变体RecGPT-7B-Instruct，在评分预测与序列推荐任务上超越基线。两相对照，P5强调用个性化提示统一多任务，RecGPT则用更大规模的全量训练领域模型换取性能。后者可视为前者的规模化延伸，但也预示了计算成本问题。\n\n与全量训练相对的路线是微调对齐，但这一路线遭遇“是否必须更新参数”的质疑。TALLRec[3]的证据最为直接：未经过推荐数据微调的LLM在推荐任务上的表现接近随机猜测（AUC≈0.5），而经过推荐数据微调后性能显著改善。消融结果进一步显示，缺少推荐数据微调（rec-tuning）的变体性能明显下降，且仅需不超过128条微调样本即可展现优势。这些结果表明，LLM的通用知识虽然丰富，但必须通过推荐数据显式激发。与之相对，文献[16]提出提示式表示学习方法（prompting-based representation learning，P4R），主张无需大规模预训练或微调，仅通过提示即可获得适用于多种候选文本的表示。其核心设计是区分内在文本信息与外在文本信息，并对此采用不同的提示处理，以避免复杂预训练或微调在多变推荐场景中的低效与退化。这一对立并非简单的孰优孰劣。TALLRec提供微调有效性的强证据，P4R则回应部署效率与灵活性诉求。两者的分歧实质是“知识激活”与“知识注入”的成本权衡。\n\n进一步的设计围绕如何整合知识与实现跨域泛化，形成了对前两条路线的修正。文献[27]指出，基于LLM的推荐中静态模式提示（static schema-based prompting）存在根本局限，主张对上下文知识进行协同整合并消解知识之间的不一致，这实际上是在提示层面为LLM补充更丰富的语义约束。RecBase[19]则走得更远。它认为语言中心预训练与推荐任务存在根本错配，仅靠文本统一无法捕获动态的、基于项目级用户行为的信息。因此RecBase将LLM仅作为编码器来生成统一语义表示，并在大规模开放数据上通过生成式预训练建模项目-项目关系，以支持零样本与多域推荐。其训练目标包含重构损失、码本损失与熵损失，显示出对离散表征的刻意设计。值得注意的是，RecBase对“语言中心预训练”的批评与P5的文本到文本假设直接冲突，而其对项目级行为的强调又与P4R“区分文本信息类型”的主张形成呼应。这条路线把问题从“如何用语言描述推荐”转向“如何在推荐语义上重新预训练”。\n\n从全量训练到微调再到提示式表示与生成式重定向，LLM在推荐中的角色从任务统一器转为语义编码器，参数更新规模不断收缩，而对表示设计与知识结构的控制逐渐增强。这一演变逻辑为下一主题——如何高效评估与部署LLM推荐系统——设定了直接背景。\n\n### 可解释推荐\n\n可解释推荐（Explainable Recommendation）是大语言模型（Large Language Model, LLM）应用于推荐系统时最早显现优势的领域之一。传统推荐模型以嵌入向量（embedding）表征用户与物品，其决策过程对用户而言是不透明的黑箱，而LLM天然具备生成流畅自然语言的能力，这为将推荐结果转化为用户可理解的解释文本提供了新的技术路径。本主题的文献沿\"综述—方法—质量优化\"三条线索展开：综述性工作[6]系统梳理了该方向的早期探索；[9]、[10]、分别从不同角度提出解释生成框架；[11]则针对解释质量不足的问题提出优化方案。这一演进逻辑反映出该领域从\"能否生成解释\"向\"如何生成高质量解释\"的范式转移。\n\n综述性工作[6]系统梳理了LLM用于推荐解释的研究现状，并指出该方向仍处于早期阶段。作者对LLM生成推荐解释的相关研究进行了系统性文献综述，并开展了一项包含97名参与者的在线用户研究，让用户与不同类型的LLM生成解释进行交互。研究结果显示，参与者明确偏好LLM生成的解释而非基线方法生成的解释，其偏好理由集中在解释的细节丰富度、创造性和信息量上。用户特别认可LLM解释能够提供上下文信息和背景知识，这增强了他们对推荐结果的信任与满意度。这一发现的深层意义在于：解释质量并非单纯的信息传递问题，而是涉及用户对推荐系统整体感知的信任建构过程。然而，该综述也揭示了这一领域的早期困境——系统性检索仅识别出六篇聚焦于LLM推荐解释的研究论文，说明该方向在当时仍处于起步阶段，缺乏成熟的方法论积累和统一的评估标准。这一判断为后续方法类工作的涌现提供了合理背景。\n\n在方法层面，[9]提出的XRec系统代表了将LLM直接嵌入推荐解释生成流程的典型尝试。XRec基于LLaMA2-7B架构构建，并采用多任务学习（multi-task learning）优化参数。其技术设计的核心创新在于处理图神经网络（Graph Neural Network, GNN）与自监督学习（Self-Supervised Learning, SSL）增强后的协同过滤（collaborative filtering）嵌入向量。由于每个节点嵌入在输入提示（prompt）中仅由单个token表示，随着输入长度增加，每个嵌入token获得的注意力权重必然稀释，导致协同信息的潜在损失。为应对这一注意力稀释问题，XRec借鉴了适配嵌入注入的思路，将特殊token纳入LLM的分词器（tokenizer），并在转换后的token嵌入中替换为对应的适配嵌入。此外，该系统使用gpt-3.5-turbo生成训练数据集并计算GPTScore作为评估指标。这一设计的贡献在于：它首次系统性地解决了将结构化推荐模型输出转化为LLM可理解输入时的信息保真问题，为后续工作提供了\"如何桥接嵌入空间与文本空间\"的参照方案。但该方法的局限同样明显——适配嵌入的注入方式依赖于特定模型架构，其泛化性尚未得到验证。\n\n与[9]从推荐模型侧出发不同，[10]关注的是跨域推荐（Cross-domain Recommendation, CDR）场景下的解释生成。该工作指出，数据稀疏性是跨域推荐面临的主要挑战，CDR模型需要大量标注数据，这构成了关键瓶颈。作者提出了一种基于指令与提示（instructing and prompting）LLM的策略，直接利用LLM的既有知识生成跨域推荐解释，从而绕开对大规模标注数据的依赖。这一思路的合理性在于：LLM在海量文本上预训练所获得的世界知识可以弥补跨域场景中用户-物品交互数据的不足。然而，该方法的潜在风险在于解释质量与跨域一致性可能过度依赖LLM自身能力，当目标域与源域差异较大时，LLM生成的解释可能缺乏领域特异性。这一局限在[11]中得到了更系统的回应。\n\n[11]直接指出了LLM-based可解释推荐系统的核心缺陷：LLM通常在通用数据上预训练，缺乏来自用户的个性化信息，因此可能生成与用户偏好不匹配的解释。作者识别出LLM生成解释存在三类低质量问题（摘要截断未完整列出），并提出通过可解释质量奖励（Explainable Quality Reward）进行微调的解决方案。其技术逻辑是：仅向LLM提供解释相关的指令提示（instructional prompt）不足以使其适应可解释推荐任务，必须使用解释数据进行微调，并通过奖励机制显式优化解释的忠实度（faithfulness）与可理解性（comprehensibility）等质量维度。这一工作的意义在于将解释质量从隐性的语言流畅性提升为可优化的显式目标，标志着该领域从\"生成解释\"向\"生成好解释\"的转变。但摘要未提供定量实验结果，奖励函数的具体设计细节与效果验证仍有待补充。\n\n[12]提出的RecExplainer则从另一个角度切入解释生成问题：不是让LLM生成面向用户的推荐理由，而是让LLM解释黑箱推荐模型自身的决策逻辑。该工作聚焦于双塔模型（two-tower model）范式，目标是微调LLM以解释预训练推荐模型的决策过程。作者区分了三种对齐（alignment）方式：行为对齐（behavior alignment）、意图对齐（intention alignment）与混合对齐（hybrid alignment），分别记为RecExplainer-B、RecExplainer-I和RecExplainer-H。行为对齐的基本思路是微调LLM使其预测行为与目标推荐模型一致——给定用户画像，LLM被训练去预测推荐模型会向用户推荐哪些物品。作者指出，行为对齐本质上与传统代理模型（surrogate model）方法类似，仅从外部模仿模型的预测观测，试图推断黑箱内部发生的过程，这并未真正触及模型的执行逻辑。因此，作者主张一种更深入的解释方式——让LLM直接理解并复述模型的内部计算逻辑。这一框架的贡献在于将可解释推荐从\"面向用户的解释\"拓展到\"面向开发者的模型诊断\"，填补了嵌入型推荐模型透明度不足的空白。但该工作仅覆盖双塔模型范式，单塔模型等其他架构的解释问题留待未来研究。\n\n综合审视这四篇核心文献，可以辨识出一条清晰的方法论演进线索。[6]通过用户研究确立了LLM生成解释的可行性与用户接受度，为后续工作提供了需求侧证据；[9]与[10]分别从单域与跨域场景验证了直接提示LLM生成解释的可行性，但两者都未系统处理解释质量问题；[11]则直面这一缺陷，引入奖励微调机制将解释质量纳入优化目标；进一步将解释的对象从\"推荐结果\"转向\"推荐模型本身\"，扩展了解释的语义边界。这一演进的内在逻辑在于：随着LLM生成解释的技术门槛降低，研究焦点从\"能否生成\"转向\"生成什么\"与\"为谁生成\"。然而，生成解释仍存在个性化不足和不一致等问题[11]；将LLM用作代理模型来解释黑盒推荐模型也仍处于初步探索阶段[12]。这些开放问题构成了从可解释推荐向推荐系统评估范式转移的衔接点——当解释质量本身成为待评估对象时，LLM作为评估者的角色便自然浮现。\n\n### 自动评估与评测\n\n自动评估与评测是大语言模型（large language model, LLM）介入推荐系统的关键支撑环节。它承担双重任务：验证LLM作为推荐器的能力边界，同时为生成式推荐输出建立可靠的质量度量。两者彼此牵连。早期研究在探查ChatGPT的推荐能力时便发现，开放文本生成形式本身就给评测带来困难[4]。后续工作由此分化。一条路径将LLM视为相关性裁判，以与人类判断的一致性作为可靠性基准[15][20]。另一条路径主张评估范式应从语义合理性转向集合级效用[17]。本主题按这一演进逻辑组织，依次考察能力探查、裁判协议与效用范式三个阶段。\n\n初期探索以Dai等人对ChatGPT推荐能力的系统检验为代表[4]。该研究设计了点式（point-wise）与成对（pair-wise）两类提示模板，将用户观影历史与候选项目输入LLM，要求其输出评分或偏好判断[4]。作者发现，原始零样本提示下超过50%的输出因格式非法而难以评估。为此引入logit_bias参数约束输出词元，使其落在合法回答范围内[4]。该文在Movie数据集上比较LLM与传统模型，基线为精心调参的矩阵分解（matrix factorization, MF）与神经协同过滤（neural collaborative filtering, NCF）[4]。指标为5次运行的NDCG@3均值及95%置信区间。结果显示，MF与NCF的性能随训练数据比例增加而提升，开箱即用的LLM模型在该比较中超越了二者[4]。这一工作的双重意义在于：既证实LLM具备零样本推荐潜力，也暴露出开放生成与评测格式之间的张力。正是这种张力，催生了后续将LLM嵌入评测流程的尝试。\n\n裁判化路径的核心工作是Cranfield评测范式从信息检索向推荐系统的迁移[15]。该研究以LLM生成项目级相关性标签，再聚合成系统级排序。实验表明，更丰富的项目元数据与更长的用户历史能提升LLM裁判与人类标签的一致性。然而项目级一致性仍属中等，尤其在细粒度兴趣区分上表现有限[15]。与之相对，由裁判标签导出的系统排序与人类判断达到高度一致。作者将这一反差归因于系统级聚合抵消了与特定系统无关的项目级误差[15]。更重要的是，LLM裁判能够纠正传统评测因标注不完整而扭曲的系统排序，识别被系统性低估或高估的系统。作者还指出，LLM裁判在系统级排序上与人类评估高度一致，可作为人工评估的有前景的补充信号[15]。该文报告了播客领域的工业案例。裁判模型被部署为额外检索源，使非习惯性播客剧集流播放量提升3.LLM裁判产生的系统级排序与基于人类标注的排序高度一致，Kendall’s τ最高可达0.92[15]。作者同时指出两类风险。其一，LLM裁判可能产生幻觉，即自信地引用不准确的剧情元素、演员阵容或用户偏好。其二，LLM裁判在条目层面的判断与人类评估的一致性仍属中等，因此更适合作为补充而非替代评估方式[15]。这些限制促使研究者探索其他评测路线。Pradhan等人[20]提出的LLM-as-a-Judge框架面向检索增强生成（retrieval-augmented generation, RAG）中的法律文献推荐评测。该工作以百分比一致率、Cohen's Kappa以及线性与二次加权的Gwet's AC2系数作为一致性指标[20]。作者承认GPT-4在部分任务上达到人类水平，同时指出认知偏差、自我偏好与系统性评测误差等已知局限。该文提出使用更稳健的一致性指标（如Gwet’s AC2和秩相关系数）以及统计检验来评估LLM裁判的可靠性[20]。可见，[15]与[20]共享同一预设：与人类判断的一致性是评测可靠性的基准。区别在于，[15]揭示了这种一致性在项目级与系统级之间存在质的分野，而[20]更关注如何以统计指标度量裁判本身的信度。\n\n对上述裁判范式提出根本质疑的是Aouali等人[17]提出的RecoAtlas。该框架认为，LLM推荐代理输出的结构化报告无法用逐项相关性标签充分度量。此类报告由项目集合与自然语言理由构成，其评测对象应从语义合理性转向集合级效用[17]。其评测流程设定如下。生成器被要求输出包含项目束（bundle）及对应查询变体的结构化JSON。该文将语义连贯性与解释质量分开度量，并通过受控工具环境评估LLM推荐智能体的行为效用[17]。解析器随后对每个LLM提出的项目束进行校验。校验操作包括：剔除未知项目ID、去重并保序、补入被遗漏的锚定项目、删除小于最小规模或截断超过最大规模的项目束。该文利用从交互数据中学习的效用代理度量推荐集合的相关性、互补性与多样性，并指出语义合理性不一定反映行为层面的效用[17]。文献[15]与[20]分别指出了LLM评测中的盲区：传统划分会导致相关性标签不完整，常用一致性度量可能产生误导。[15][20]相关性判断回答的是\"这些项目是否贴合查询\"。集合级效用回答的是\"这组项目组合能否实际满足用户目标\"。即便每个项目都被裁判判定为相关，组合层面的互补性与情境适配性仍可能决定推荐的实际价值。\n\n综上，本主题呈现出从\"LLM能否被可靠度量\"到\"什么才是推荐的正确度量\"的递进逻辑。[4]以格式约束换取可评测性，[15]与[20]以人类一致性确立裁判合法性，[17]则以集合级效用重新定义评测对象。这一争论牵动推荐系统根本目标的界定，即用户效用而非文本合理性。下一主题将讨论如何通过提示、微调与对齐使LLM推荐器优化这些目标。\n\n### 效率、公平性与鲁棒性\n\n效率、公平性与鲁棒性构成了大语言模型（Large Language Model, LLM）推荐系统从实验室走向实际部署时必须跨越的三重门槛。效率关乎推理成本与响应延迟，公平性关乎推荐结果在不同用户群体间的分配正义，鲁棒性则关乎系统在冷启动、对抗攻击等非理想条件下的生存能力。本主题的文献呈现出一条清晰的演进线索：早期工作集中于验证LLM能否完成推荐任务，随后研究重心转向其部署代价与系统性缺陷，最终汇聚为对LLM推荐系统可信赖性的整体审视。以下按\"效率优化—冷启动与公平性—安全鲁棒性\"的轴线展开论述。\n\n效率问题的根源在于LLM的序列生成范式与推荐系统的实时性需求之间的根本张力。基于LLM的推荐器需要处理冗长的用户历史文本，而自回归解码的逐token生成机制使得推理延迟随输入长度近似线性增长。针对这一瓶颈，[7]提出的提示蒸馏（Prompt Distillation）方法从输入侧入手，将冗长、含噪的用户行为文本压缩为精炼的提示向量，从而在不牺牲语义信息的前提下缩短模型需要处理的序列长度。该工作的动机在于：原始提示中大量与用户偏好无关的噪声token不仅拖慢推理速度，还可能干扰模型的注意力分配。其方法机制可概括为\"教师—学生\"式的提示压缩——用完整提示训练得到的教师模型指导学生模型学习生成更短的提示表征。这一设计的意义在于将效率优化从模型架构层面转移到输入表征层面，使得蒸馏后的提示可以即插即用地适配不同规模的LLM。然而，该方法的局限同样明显：蒸馏过程本身需要额外的训练开销，且压缩后的提示是否保留了对冷启动用户至关重要的细粒度偏好信号，摘要中并未给出定量验证。\n\n效率问题的另一面是冷启动场景下的计算资源浪费。当新用户或新物品缺乏交互数据时，LLM被迫依赖其世界知识进行零样本推理，而这一过程往往需要多次提示尝试才能获得稳定输出。[8]的综述将冷启动置于LLM时代的宏观背景下审视，指出互联网平台的多元化与用户、物品规模的指数级增长使得冷启动问题的重要性持续上升。该综述的核心贡献在于提供了一个系统化的路线图，将现有研究按\"利用LLM世界知识\"与\"设计多步提示流程\"两条技术路径分类。例如，其引用的工作通过三步提示引导LLM依次完成背景数据预处理、用户行为因素加权和兴趣点（POI）推荐生成；另有工作将原始签到记录通过键值相似度转换为问答任务，再结合当前与历史轨迹设计提示。这些方法的共同逻辑是：用额外的提示步骤弥补交互数据的缺失，以计算开销换取推荐质量。但[8]指出，冷启动推荐在LLM时代仍是长期存在的挑战，并强调相关研究仍需系统梳理与展望。\n\n冷启动场景不仅是效率挑战，更是公平性风险的温床。[13]的实证研究揭示了这一矛盾的严重性：在仅提供年龄、性别、语言等有限人口统计学信号的冷启动设置下，LLM推荐器会基于用户的敏感属性引入系统性偏差。该工作设计了一个自动化基准测试框架，其核心机制是将推荐任务形式化为重排序（re-ranking）任务——给定包含N个物品的目录，要求LLM选出并排序k个（如5、10或20个）最匹配用户偏好的物品。偏差度量采用\"属性相似度差异\"指标：分别计算在提示中包含敏感属性A、B与中性提示下推荐列表的相似度，以1减去该相似度作为偏差分数。这一设计的精妙之处在于将公平性测量从主观判断转化为可复现的量化指标，且框架支持用户自定义数据集与敏感属性，具有跨场景的可迁移性。该研究的核心发现是：LLM推荐器在丰富上下文设置下表现良好，但冷启动行为引发公平性担忧——当用户信号稀缺时，模型倾向于依赖人口统计学特征进行推断，从而对特定群体产生系统性歧视。这一发现与[8]的乐观预期形成鲜明对照：LLM的世界知识虽能缓解冷启动的覆盖率问题，却可能以放大社会偏见为代价。\n\n公平性问题并不局限于冷启动场景。[14]的研究将视角扩展到流行度偏差（popularity bias），揭示了一个更深层的机制性缺陷：现有去偏方法将流行度偏差仅视为多样性增强问题，而忽视了其语义维度。该工作的实证观察表明，LLM推荐器不仅继承了流行度偏差，而且会放大它——即使被明确提示\"多样性\"或\"去偏\"指令，模型生成的推荐仍被流行物品主导，导致具有小众偏好的用户面临明显的性能差距。更值得注意的是，当被提示增加多样性时，模型只是替换了不同的流行物品，而非真正引入长尾物品，这暴露了其语义理解的表面性。该工作提出的LLM框架试图将流行度偏差的语义理解与去偏操作桥接起来，其方法设计基于70%/30%的时间分割协议划分训练与测试集，以捕捉用户偏好的时间动态并防止数据泄漏。这一设计选择体现了对评估严谨性的重视——去偏效果必须在真实的时间演化条件下验证，而非静态的随机分割。该研究的批判性贡献在于：它质疑了\"提示即去偏\"的朴素假设，表明LLM的语义理解能力与行为层面的去偏之间存在鸿沟，这一鸿沟需要专门的框架设计而非简单的指令工程来弥合。\n\n与[14]揭示的\"提示无法纠正偏差\"形成互补的是[21]提出的语言模型先验（Language-Model Prior）方法，后者从生成侧为冷启动物品提供解决方案。该工作的出发点在于：推荐系统中的内容变化迅速，新物品缺乏交互数据因而难以估值，传统的内容过滤与混合方法依赖物品元数据计算相似度，但元数据本身在冷启动阶段往往不完整。语言模型先验的核心思想是利用LLM预训练阶段习得的世界知识为冷启动物品提供初始表征或预测，从而绕过对交互数据的依赖。这一方法的意义在于将冷启动问题的求解从\"数据补全\"转向\"知识迁移\"——LLM对物品语义的理解可以部分替代交互信号。然而，该工作的局限同样值得注意：其关注点局限于物品冷启动，对用户冷启动及动态内容场景的适用性未作说明；且摘要未提供定量结果与基线对比，其实际增益幅度尚待验证。将[21]与[13]并置，可以看到LLM时代冷启动问题的两面性：语言模型先验提供了乐观的解决路径，而实证研究则揭示了这一路径在公平性维度上的代价。\n\n安全鲁棒性构成了这一主题的收束点。[25]提出的CheatAgent系统将攻击视角引入LLM推荐系统研究，其研究问题直指安全漏洞：LLM智能体能否被操纵以破坏推荐系统的完整性？该工作基于LLM智能体的攻击方法设计，其潜在机制是利用LLM的指令跟随特性，通过精心构造的对抗性对话诱导推荐器输出恶意或有害内容。这一工作的价值在于将推荐系统安全从传统的\"数据投毒\"范式扩展到\"提示攻击\"范式——攻击者不再需要污染训练数据，只需在推理阶段与推荐器交互即可达成攻击目标。尽管摘要未提供具体攻击成功率等定量结果，但其提出的问题本身已具有重要的警示意义：当推荐系统从封闭的协同过滤模型转向开放的对话式LLM时，攻击面随之急剧扩大。将[25]与前述工作串联，可以勾勒出LLM推荐系统鲁棒性讨论的完整逻辑：效率优化（[7]）与冷启动缓解（[8]、）解决了部署的可行性问题，公平性研究（[13]、）揭示了模型在非理想条件下的系统性缺陷，而安全攻击（[25]）则表明这些缺陷可能被恶意利用，构成实际的安全威胁。\n\n从效率到公平性再到安全，这一演进逻辑的内在驱动力是LLM推荐系统从\"能否工作\"到\"能否可信地工作\"的问题转换。效率优化为部署扫清了计算障碍，冷启动研究暴露了数据稀缺条件下的行为偏差，公平性分析揭示了偏差的系统性本质，而安全攻击则将这些偏差从学术关切转化为现实威胁。四者共同指向一个核心判断：LLM推荐系统的可信赖性不能由单一维度的性能指标保证，而必须在效率、公平与安全的交叉约束下整体设计。这一判断为下一主题——LLM推荐系统的评估范式与对齐方法——提供了问题背景：当传统评估指标无法捕捉公平性损失与安全漏洞时，需要新的评估框架与对齐策略来确保LLM推荐系统在真实世界中的负责任部署。\n\n### 对话与多模态推荐\n\n对话与多模态推荐是LLM推荐系统在交互复杂性与内容异构性上的两个延伸方向。对话推荐面临的核心问题是自然语言表达的多样性，尤其是“我在注意体重”这类间接表述难以映射为可检索的偏好条件[18]。多模态推荐则要平衡语义化表示带来的增益与在线系统对效率和延迟的硬约束[22][23]。这一主题的周边已有生成式推荐综述[28]，以及将提示策略用于新闻推荐[29]、以弱模态信号增强多模态推荐[30]等探索。本主题以“表示与效率”为组织轴，先比较对话推荐中状态追踪与知识注入两种机制，再分析多模态推荐中表示压缩与架构分级两类效率方案，最后归纳两者共同暴露的评估缺口。\n\n对话推荐的第一条技术路线，把问题转化为状态表示的构造问题。Kemper等人[18]提出的RA-Rec以提示驱动的半结构化自然语言状态追踪为核心，用LLM执行多标签意图分类，并持续更新一个JSON格式的半结构化对话状态。这一设计的特点在于折中：状态键保留结构的可控性，LLM生成的状态值则容纳自然语言的细微表达。由此，系统能应对间接、无法直接检索的偏好表述[18]。该系统以GPT-3.5-turbo实现全部提示步骤，其检索增强模块在Yelp学术数据集的1298家餐厅和超过46K条评论上进行演示。RA-Rec本身不绑定特定LLM，任何基于提示的模型都可以替换使用[18]。这一选择的意义在于，它证明提示驱动的对话推荐无需微调即可在真实数据集上运转。但摘要未报告推荐质量的量化指标，系统的有效性论证因此仍然不完整。\n\n对话推荐的第二条路线质疑LLM自身知识的充分性，主张以外部知识补偿。文献[24]观察到，ChatGPT等高级LLM在领域特定的对话推荐任务上能力受限，尤其在生成扎根于推荐知识的响应时[24]。该工作将外部知识与目标引导整合进LLM的使用流程，使生成过程受明确推荐目标的约束[24]。与RA-Rec用检索文本补充上下文不同[18]，这条路线依赖结构化知识与任务级引导，其差异实质是对LLM知识缺口性质的判断不同：检索增强偏向动态事实和个体偏好，知识注入偏向稳定且关系密集的领域知识。但[24]的摘要实际上包含方法设计与实验证据：采用知识检索代理与目标规划代理，并在两个多目标CRS数据集上报告了改进。两项工作共同表明，对话推荐系统的瓶颈已经不在通用语言理解，而在推荐特定的状态建模与知识利用。\n\n多模态推荐一侧的共同约束是效率。Wang等人提出的Matryoshka表示学习（Matryoshka Representation Learning）面向顺序推荐，将语言与视觉信息整合进同一模型，训练完成后可在不同表示大小下部署，以适应多样化的效率要求[22]。该方案把效率问题放到表示维度上解决：部署环节可以按场景选择表示粒度[22]。与之相对，文献[23]提出的LMSR在系统架构层面处理同一问题。LMSR是一个两阶段框架，将大模型的语义排序引入大规模在线广告推荐，用阶段分离隔离语义计算的延迟成本[23]。这两种方案的分工表明，多模态语义融入推荐存在表示压缩与架构分级两条互补路径。但两篇摘要都止步于框架描述：Matryoshka未说明表示压缩与精度之间的量化关系[22]，LMSR未给出任何延迟或准确性指标[23]。效率改进的实际幅度，在目前公开的文本中无法判断。\n\n将对话与多模态两条线并置，可以看到一个共同的设计逻辑：LLM的语义能力是推荐质量的潜在来源，但其计算代价必须通过工程手段消化。RA-Rec用半结构化状态限制LLM输出的自由度[18]，文献[24]用目标引导约束生成方向[24]，Matryoshka在向量维度上压缩语义表示[22]，LMSR在计算流程中安排分级[23]。四者共享一个未经检验的前提：语义增强带来的准确率收益大于其引入的延迟与误差成本。这一前提之所以悬置，部分原因是评估标准本身未定义清楚——对话推荐要优化任务完成率还是对话自然度，多模态排序要优先精度还是延迟。因此，在摘要层面，本主题的部分文献呈现方案多于证据：[18]与[23]未报告量化结果，[22]亦未给出具体实验数据；而[24]的摘要则明确报告了实验改进。\n\n从RA-Rec的半结构化状态追踪到Matryoshka的多尺度表示，本主题的演进逻辑可以概括为由外而内：LLM先被接入对话前端处理表达，再下沉到表示与排序后端处理效率。语义能力最终驻留在哪个环节，取决于效率与准确性的代价平衡。这自然引向对评估方法本身的研究，即如何为这类系统建立可比较的度量标准。\n\n## 批判性综合\n\n是否需要针对推荐任务进行显式微调，是贯穿本领域的第一层框架性争论。作者等人[0]与作者等人[1]较早报告大语言模型在知识广度与泛化能力上的潜力，该项能力构成推荐应用的前提，但潜力并不自动转化为推荐效能。作者等人[3]提出的TALLRec依据指令调优实验主张，通用语言模型必须经过推荐数据对齐才能有效工作。与之相对，作者等人[4]对ChatGPT零样本能力的考察与作者等人[16]提出的纯提示表示学习方法都认为，不更新参数即可直接支撑推荐流程。作者等人[19]提出的RecBase则将分歧推到极端。[2]与[26]提出的文本适配方案将推荐任务统一为语言建模/生成问题，以利用预训练语言模型的能力。该矛盾并非调参之争，而是关于语言知识表征形态的认识论分歧。前者假定语言知识与推荐知识属于不同范畴，后者假定二者在语言层已经同构。由于提示与微调同时改变模型状态与任务接口，现有对比实验无法把两种解释分离开来。\n\n冷启动问题展现出乐观预期与实证结果之间的系统性张力。作者等人[21]提出的语言先验方案主张以先验知识覆盖冷启动物品，隐含假设先验可以替代交互历史。作者等人[13]在人口统计信号受限的冷启动设定下报告了推荐结果中的公平性偏差。这提示先验并非中立，而是携带用户属性层面的系统性倾斜。作者等人[8]仍将冷启动归为未解决的关键挑战。若先验完全可迁移，[13]报告的偏差不应出现；若先验毫无作用，[21]的方案便缺少机制基础。两者在各自条件下都成立，因此现实落于中间地带：先验提供领域线索，却无法替代用户级信号，并可能放大社会偏见。冷启动研究应当把提问方式从“可否解决”转为“先验在何种约束下可被安全启用”。\n\n可解释性方向的分歧聚焦于直接生成的充分性。作者等人[6]较早利用大语言模型生成自然语言解释；作者等人[9]与作者等人[10]提出的直接提示策略延续该设置，把生成流畅度当作解释有效性的代理指标。作者等人[11]与作者等人[12]则依据评测证据反驳该策略：未经对准的生成解释质量不足，需要追加奖励微调或对齐环节。二者的冲突提示，文本生成能力与解释能力并不重合。前者是预训练的产物，后者要求解释面向用户意图、覆盖物品属性并保持推理忠实。因此“能说出理由”不等于“给出好理由”。但两类工作对“好解释”缺乏共同度量，它们对彼此结论的批评无法直接判定。\n\n评估范式分歧暴露了推荐目标的深层分裂。作者等人[17]主张评估应从语义合理性转向集合级效用（set-level utility），将推荐视作组合优化问题。作者等人[15]与作者等人[20]则强调大语言模型裁判与人类相关性判断的一致性，把推荐放回信息检索传统。组合视角要求一组结果最大化决策收益，相关性视角只要求单个候选被感知为相关。同一生成结果在两类标准下可能得到相反评分：效用标准惩罚流畅但冗余的输出，相关性标准可能奖励此类输出。评估选择因此不是技术细节而是规范性预设；它直接决定系统的优化目标与性能报告内容。跨文献比较只有同时报告两类指标才具备意义。\n\n效率与延迟是文献中罕见的共识性障碍，作者等人[7]、作者等人[22]与作者等人[23]分别以提示蒸馏、表示压缩与推理加速等策略加以应对。该交集恰恰为上述争论提供了综合线索。零样本模型在冷启动与解释质量上均无稳定保证，因此纯粹面向效率的压缩并不能自动弥补质量缺口。若微调确有必要，压缩与微调就应当联合设计，而非作为后处理步骤。大语言模型推荐系统的核心命题因而既不是“直接使用还是微调”，也不是“如何压缩加速”，而是“在哪个任务层上施加最少且必要的适应性信号，并在该信号定义上建立统一评估框架”。将争论落到这一层面，才能把上述矛盾转化为可检验的研究问题。\n\n## 总结与展望\n\n基于大语言模型的推荐系统已从概念验证阶段演进为一个多分支的研究领域。现有工作确立了若干基础性结论。将推荐任务统一建模为语言处理范式（[2]）以及通过指令微调对齐模型与推荐目标（[3]）已被证明是可行的技术路线。在可解释性方面，利用LLM生成自然语言解释已成为主流方案（[9]），但生成质量存在个性化不足、忠实度欠缺等系统性问题（[11]）。这一领域的分歧集中在两个层面。其一，LLM在推荐系统中的角色定位尚无共识：一派主张将LLM作为核心推荐引擎，另一派则将其视为辅助组件，用于增强传统协同过滤或基于内容的模型。其二，评估方法论存在根本性争议。尽管LLM作为裁判的评估方式在信息检索领域显示出与人工判断的一致性（[15]），但其在推荐场景中的可靠性、可复现性以及是否应取代基于交互行为的离线指标，仍是未决问题。\n\n当前研究的主要短板在于系统性验证的缺失。[16]在摘要中说明了与state-of-the-art推荐模型的对比评估，而[18]与[21]的摘要主要以框架或方法展示为主，未提供量化对比结果。效率问题仅有零星工作触及：提示蒸馏（[7]）和多分辨率表示学习（[22]）分别从推理速度和表征压缩角度切入，但缺乏跨模型、跨任务的系统性效率分析。公平性研究局限于冷启动场景下的特定偏差（[13]）和流行度偏差（[14]），尚未形成覆盖多用户群体、多交互类型的系统审计框架。鲁棒性研究几乎空白，仅有一项工作考察了针对LLM推荐系统的对抗攻击（[25]），数据投毒、提示注入等威胁向量均未得到充分探讨。\n\n未来研究应优先攻克以下开放问题。第一，建立标准化的评测基准与协议。当前LLM-as-judge方案（[15]、[17]、[20]）各自为政，评测设置差异显著，亟需一个统一的评测框架以支持跨系统比较。第二，发展面向动态用户行为的建模方法。现有工作多假设用户偏好静态不变，而[19]已指出语言中心预训练与推荐任务之间的根本性错配，时间演化偏好与会话级动态的建模尚缺乏系统评估。第三，推进跨域推荐的知识迁移研究。目前仅有[10]涉及可解释跨域推荐，大规模评估LLM在不同领域间的零样本泛化能力仍是空白。第四，构建多模态、对话式与公平性感知的整合框架。现有多模态工作（[22]、[23]）聚焦于效率优化，尚未与可解释性、公平性等维度形成有机整合。第五，系统性地研究安全与鲁棒性问题。对抗攻击（[25]）仅是起点，数据投毒、提示注入、模型窃取等威胁向量需要建立防御体系。第六，探索效率与效果的可扩展权衡方案。提示蒸馏（[7]）和两阶段排序（[23]）提供了初步思路，但如何在保持推荐质量的前提下实现推理成本的可控降低，仍需更全面的方法论支撑。上述问题的解决将决定LLM推荐系统从实验室原型走向大规模实际部署的可行性。\n\n## 参考文献\n\n[0] Wu, L., Zheng, Z., Qiu, Z., Wang, H., Gu, H., Shen, T., Qin, C., Zhu, C., Zhu, H., Liu, Q., et al. (2024). A survey on large language models for recommendation. *World Wide Web*. https://doi.org/10.1007/s11280-024-01291-2\n[1] Zhao, Z., Fan, W., Li, J., Liu, Y., Mei, X., Wang, Y., Wen, Z., Wang, F., Zhao, X., Tang, J., et al. (2024). Recommender Systems in the Era of Large Language Models (LLMs). *IEEE Transactions on Knowledge and Data Engineering*. https://doi.org/10.1109/tkde.2024.3392335\n[2] Geng, S., Liu, S., Fu, Z., Ge, Y., Zhang, Y. (2022). Recommendation as Language Pr const ZH = {supported:"有依据",partial:"部分依据",background:"仅背景支撑",
            contradictory:"与原文相左",unsupported:"无依据",unverifiable:"无法核验"};
const CLS = {supported:"ok",partial:"warn",background:"warn",
             contradictory:"bad",unsupported:"bad",unverifiable:"dim"};
let filter = "all";

document.getElementById("topic").textContent = "综述审阅 — " + DATA.topic;
const pct = x => x == null ? "—" : (x*100).toFixed(0) + "%";
document.getElementById("headline").innerHTML =
  "引用精度 <b>" + pct(DATA.precision) + "</b>" +
  (DATA.pre != null ? "（改写前 " + pct(DATA.pre) + " → 改写后 " + pct(DATA.post) + "）" : "") +
  " · 论断 " + DATA.claims.length + " 条" +
  (DATA.papers_cited != null ? " · 引用覆盖 " + DATA.papers_cited + "/" + DATA.papers_total + " 篇" : "");

const stats = document.getElementById("stats");
const mk = (key, label) => {
  const n = key === "all" ? DATA.claims.length : (DATA.counts[key] || 0);
  const el = document.createElement("span");
  el.className = "chip" + (filter === key ? " active" : "");
  el.textContent = label + " " + n;
  el.onclick = () => { filter = key; render(); };
  return el;
};
const chips = () => {
  stats.innerHTML = "";
  stats.appendChild(mk("all", "全部"));
  for (const k of Object.keys(ZH)) stats.appendChild(mk(k, ZH[k]));
};

const track = document.getElementById("track");
const segs = () => {
  track.innerHTML = "";
  const order = ["supported","partial","background","contradictory","unsupported","unverifiable"];
  const cls = {"supported":"seg-ok","partial":"seg-warn","background":"seg-warn",
               "contradictory":"seg-bad","unsupported":"seg-bad","unverifiable":"seg-dim"};
  const total = DATA.claims.length || 1;
  for (const k of order) {
    const n = DATA.counts[k] || 0;
    if (!n) continue;
    const s = document.createElement("div");
    s.className = cls[k];
    s.style.width = (100*n/total) + "%";
    s.title = ZH[k] + " " + n;
    track.appendChild(s);
  }
};

function esc(s){const d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML;}

function render() {
  chips(); segs();
  const q = document.getElementById("q").value.trim().toLowerCase();
  const box = document.getElementById("claims");
  box.innerHTML = "";
  let shown = 0;
  for (const c of DATA.claims) {
    if (filter !== "all" && c.verdict !== filter) continue;
    if (q && !(c.text.toLowerCase().includes(q) ||
               c.cites.some(i => ("["+i+"]").includes(q)))) continue;
    if (++shown > 300) break;
    const el = document.createElement("div");
    el.className = "claim";
    let html = '<div class="head"><span class="badge ' + CLS[c.verdict] + '">' +
      ZH[c.verdict] + '</span><span class="meta">论断 ' + (c.i+1) +
      (c.leni ? ' · <span class="leni">★严格复审建议降级</span>' : '') +
      ' · 引用 ' + c.cites.map(i => "["+i+"]").join(" ") + '</span></div>';
    html += "<p>" + esc(c.text) + "</p>";
    if (c.note) html += '<div class="note">核验理由：' + esc(c.note) + "</div>";
    if (c.evidence && c.evidence.length) {
      html += '<details><summary>证据锚点（' + c.evidence.length + "）</summary>";
      for (const e of c.evidence) {
        html += '<div class="ev"><b>[' + e.index + "] " + e.chunk_id + " (" + e.kind +
                ")</b><br>" + esc(e.excerpt) + "</div>";
      }
      html += "</details>";
    }
    el.innerHTML = html;
    box.appendChild(el);
  }
  if (!shown) box.innerHTML = '<div class="meta">无匹配论断</div>';
}
document.getElementById("q").addEventListener("input", render);

const papers = document.getElementById("papers");
let ft = 0;
for (const p of DATA.papers) {
  if (p.fulltext) ft++;
  const d = document.createElement("div");
  d.className = "paper";
  d.innerHTML = "[" + p.index + "] " + esc(p.title.length > 46 ? p.title.slice(0,46)+"…" : p.title) +
    ' <span class="' + (p.fulltext ? "ft" : "noft") + '">' +
    (p.fulltext ? "全文·" + p.chunks + "块" : "仅摘要") + "</span>";
  papers.appendChild(d);
}
if (DATA.papers.length)
  papers.insertAdjacentHTML("afterbegin", '<div class="meta">全文 ' + ft + "/" +
    DATA.papers.length + " 篇" +
    (DATA.supporting ? " · 支持文献（仅摘要）" + DATA.supporting + " 篇" : "") +
    "</div>");

const dl = document.getElementById("dl");
dl.innerHTML = "";
if (DATA.review_md) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([DATA.review_md], {type:"text/markdown"}));
  a.download = "review.md"; a.textContent = "review.md";
  dl.appendChild(a);
}
for (const [uri, name] of [[DATA.bib_uri,"references.bib"],[DATA.ris_uri,"references.ris"]]) {
  if (!uri) continue;
  const a = document.createElement("a");
  a.href = uri; a.download = name; a.textContent = name;
  dl.appendChild(a);
}
if (DATA.leni && DATA.leni.sampled) {
  document.getElementById("leni").textContent =
    "宽严抽检：采样 " + DATA.leni.sampled + " 条 supported，" +
    DATA.leni.downgraded + " 条建议降级（一致率 " +
    (DATA.leni.agreement_rate == null ? "—" : (DATA.leni.agreement_rate*100).toFixed(0)+"%") + "）";
}
render();
</script>

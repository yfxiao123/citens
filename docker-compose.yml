services:
  citens:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./runs:/app/runs          # generated reviews & artifacts
      - ./papers:/app/papers      # drop your paywalled PDFs here (see fetch_list.md)
      - ./data:/app/data          # SJR dataset (citens sjr) & cache
